---

name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Build the library and run the test suite on every platform we support.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

  # Catch memory errors and undefined behavior.
  sanitizers:
    name: Address + Undefined Behavior Sanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests with sanitizers
        run: make test-asan

  # Make sure the code is formatted.
  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-18
